<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トイレ発見器</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Space+Grotesk:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d2e;
    --surface2: #252840;
    --accent: #4fffb0;
    --accent2: #ff6b6b;
    --accent3: #ffd166;
    --text: #e8eaf6;
    --muted: #6b7280;
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  header {
    padding: 14px 20px;
    background: var(--surface);
    border-bottom: 1px solid #ffffff0f;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 1000;
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 900;
    font-size: 22px;
    background: linear-gradient(135deg, var(--accent), #00d4ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
  }

  .logo-icon {
    font-size: 26px;
    animation: bounce 2s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  /* Main layout */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Map */
  #map {
    flex: 1;
    min-height: 0;
    position: relative;
    z-index: 1;
  }

  /* Panel */
  .panel {
    background: var(--surface);
    border-top: 1px solid #ffffff10;
    padding: 14px 16px;
    flex-shrink: 0;
    max-height: 45%;
    overflow-y: auto;
  }

  /* Search button */
  .btn-search {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent), #00d4ff);
    color: #0f1117;
    border: none;
    border-radius: var(--radius);
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    letter-spacing: 0.3px;
  }

  .btn-search:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-search:active { transform: translateY(0); }
  .btn-search:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Status */
  .status {
    text-align: center;
    padding: 10px;
    font-size: 13px;
    color: var(--muted);
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .status.loading { color: var(--accent); }
  .status.error { color: var(--accent2); }
  .status.success { color: var(--accent); }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toilet list */
  .section-title {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 13px;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .toilet-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .toilet-item {
    background: var(--surface2);
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.15s;
    border: 1px solid transparent;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .toilet-item:hover {
    border-color: var(--accent);
    transform: translateX(3px);
  }

  .toilet-item.active {
    border-color: var(--accent);
    background: #4fffb01a;
  }

  .toilet-icon-wrap {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .toilet-icon-wrap.public { background: #4fffb020; }
  .toilet-icon-wrap.private { background: #ffd16620; }
  .toilet-icon-wrap.unknown { background: #6b728020; }

  .toilet-info { flex: 1; min-width: 0; }

  .toilet-name {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
  }

  .toilet-meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .badge {
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }

  .badge-dist {
    background: #4fffb020;
    color: var(--accent);
  }

  .badge-fee {
    background: #ff6b6b20;
    color: var(--accent2);
  }

  .badge-accessible {
    background: #00d4ff20;
    color: #00d4ff;
  }

  .badge-open {
    background: #ffd16620;
    color: var(--accent3);
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 30px 20px;
    color: var(--muted);
  }

  .empty-icon { font-size: 40px; margin-bottom: 10px; }
  .empty p { font-size: 14px; line-height: 1.6; }

  /* Leaflet overrides */
  .leaflet-container { background: #1a1d2e; }
  .leaflet-tile { filter: brightness(0.85) saturate(0.9); }

  .custom-marker {
    background: var(--accent);
    border: 3px solid #0f1117;
    border-radius: 50%;
    box-shadow: 0 0 0 2px var(--accent), 0 4px 12px rgba(79,255,176,0.4);
  }

  .user-marker {
    background: #ff6b6b;
    border: 3px solid #0f1117;
    border-radius: 50%;
    box-shadow: 0 0 0 2px #ff6b6b, 0 4px 12px rgba(255,107,107,0.5);
  }

  .leaflet-popup-content-wrapper {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid #ffffff15;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .leaflet-popup-tip { background: var(--surface2); }
  .leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.6; }
  .leaflet-popup-content b { color: var(--accent); font-family: 'Zen Maru Gothic', sans-serif; }

  /* Radius slider */
  .radius-control {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--muted);
  }

  .radius-control label { white-space: nowrap; }

  input[type=range] {
    flex: 1;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .radius-val {
    font-weight: 700;
    color: var(--accent);
    min-width: 50px;
    text-align: right;
  }
</style>
</head>
<body>

<header>
  <span class="logo-icon">🚻</span>
  <span class="logo">トイレ発見器</span>
</header>

<div class="main">
  <div id="map"></div>

  <div class="panel">
    <div class="radius-control">
      <label>検索範囲</label>
      <input type="range" id="radius" min="200" max="2000" step="100" value="500">
      <span class="radius-val" id="radiusVal">500m</span>
    </div>
    <button class="btn-search" id="btnSearch" onclick="searchToilets()">
      <span>📍</span> 現在地から近くのトイレを探す
    </button>
    <div class="status" id="status"></div>
    <div id="listArea"></div>
  </div>
</div>

<script>
  // Map init
  const map = L.map('map', { zoomControl: true }).setView([35.6812, 139.7671], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  let userMarker = null;
  let toiletMarkers = [];
  let userLatLng = null;
  let activeIndex = -1;

  // Radius slider
  const radiusSlider = document.getElementById('radius');
  const radiusVal = document.getElementById('radiusVal');
  radiusSlider.oninput = () => { radiusVal.textContent = radiusSlider.value + 'm'; };

  function setStatus(msg, type='') {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + type;
  }

  function makeIcon(color, size=14) {
    return L.divIcon({
      className: '',
      html: `<div style="width:${size}px;height:${size}px;background:${color};border:2.5px solid #0f1117;border-radius:50%;box-shadow:0 0 0 2px ${color},0 3px 10px ${color}55;"></div>`,
      iconSize: [size, size],
      iconAnchor: [size/2, size/2]
    });
  }

  function distStr(m) {
    return m < 1000 ? Math.round(m) + 'm' : (m/1000).toFixed(1) + 'km';
  }

  function dist(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const dLat = (lat2-lat1)*Math.PI/180;
    const dLng = (lng2-lng1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  async function searchToilets() {
    const btn = document.getElementById('btnSearch');
    btn.disabled = true;
    setStatus('📡 現在地を取得中...', 'loading');

    // Clear old markers
    toiletMarkers.forEach(m => map.removeLayer(m));
    toiletMarkers = [];
    document.getElementById('listArea').innerHTML = '';
    activeIndex = -1;

    navigator.geolocation.getCurrentPosition(async pos => {
      userLatLng = [pos.coords.latitude, pos.coords.longitude];

      // User marker
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.marker(userLatLng, { icon: makeIcon('#ff6b6b', 16) })
        .addTo(map)
        .bindPopup('<b>📍 現在地</b>');

      map.setView(userLatLng, 16);

      setStatus('🔍 トイレを検索中...', 'loading');

      const radius = parseInt(radiusSlider.value);
      const [lat, lng] = userLatLng;

      // Overpass API query
      const query = `
        [out:json][timeout:15];
        (
          node["amenity"="toilets"](around:${radius},${lat},${lng});
          way["amenity"="toilets"](around:${radius},${lat},${lng});
        );
        out center tags;
      `;

      try {
        const res = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: 'data=' + encodeURIComponent(query)
        });
        const json = await res.json();
        const elements = json.elements || [];

        if (elements.length === 0) {
          setStatus(`😢 半径${radius}m以内にトイレが見つかりませんでした`, 'error');
          btn.disabled = false;
          return;
        }

        // Build toilet list with distance
        const toilets = elements.map(el => {
          const tlat = el.lat ?? el.center?.lat;
          const tlng = el.lon ?? el.center?.lon;
          const d = dist(lat, lng, tlat, tlng);
          const tags = el.tags || {};
          return { lat: tlat, lng: tlng, d, tags };
        }).sort((a,b) => a.d - b.d);

        setStatus(`✅ ${toilets.length}件のトイレが見つかりました！`, 'success');

        // Markers
        toilets.forEach((t, i) => {
          const marker = L.marker([t.lat, t.lng], { icon: makeIcon('#4fffb0', 14) })
            .addTo(map)
            .bindPopup(popupHtml(t));
          marker.on('click', () => activateItem(i));
          toiletMarkers.push(marker);
        });

        // List
        renderList(toilets);

        // Fit bounds
        const bounds = L.latLngBounds([userLatLng, ...toilets.slice(0,10).map(t => [t.lat, t.lng])]);
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 17 });

      } catch(e) {
        setStatus('❌ 検索に失敗しました。しばらく待ってから再試行してください', 'error');
      }

      btn.disabled = false;
    }, err => {
      const msgs = {1:'位置情報へのアクセスが拒否されました', 2:'位置情報を取得できませんでした', 3:'タイムアウトしました'};
      setStatus('⚠️ ' + (msgs[err.code] || '不明なエラー'), 'error');
      btn.disabled = false;
    }, { enableHighAccuracy: true, timeout: 10000 });
  }

  function popupHtml(t) {
    const tags = t.tags;
    const name = tags.name || tags['name:ja'] || 'トイレ';
    const fee = tags.fee === 'yes' ? '💴 有料' : tags.fee === 'no' ? '🆓 無料' : '';
    const access = tags.wheelchair === 'yes' ? '♿ 車椅子対応' : '';
    const open = tags.opening_hours ? `🕐 ${tags.opening_hours}` : '';
    return `<b>🚻 ${name}</b><br>${[fee, access, open].filter(Boolean).join('<br>') || '詳細情報なし'}`;
  }

  function renderList(toilets) {
    const area = document.getElementById('listArea');
    area.innerHTML = `<div class="section-title" style="margin-bottom:10px;">近くのトイレ ${toilets.length}件</div><div class="toilet-list" id="toiletList"></div>`;
    const list = document.getElementById('toiletList');

    toilets.forEach((t, i) => {
      const tags = t.tags;
      const name = tags.name || tags['name:ja'] || `トイレ #${i+1}`;
      const fee = tags.fee === 'yes';
      const accessible = tags.wheelchair === 'yes';
      const hasHours = !!tags.opening_hours;
      const access = tags.access || 'public';

      const iconType = access === 'private' ? 'private' : access === 'customers' ? 'private' : 'public';
      const iconEmoji = iconType === 'private' ? '🔒' : '🚻';
      const iconClass = `toilet-icon-wrap ${iconType}`;

      const item = document.createElement('div');
      item.className = 'toilet-item';
      item.id = `ti-${i}`;
      item.innerHTML = `
        <div class="${iconClass}">${iconEmoji}</div>
        <div class="toilet-info">
          <div class="toilet-name">${name}</div>
          <div class="toilet-meta">
            <span class="badge badge-dist">📍 ${distStr(t.d)}</span>
            ${fee ? '<span class="badge badge-fee">有料</span>' : '<span class="badge" style="background:#4fffb020;color:var(--accent)">無料</span>'}
            ${accessible ? '<span class="badge badge-accessible">♿</span>' : ''}
            ${hasHours ? '<span class="badge badge-open">時間制限あり</span>' : ''}
          </div>
        </div>
      `;
      item.onclick = () => activateItem(i);
      list.appendChild(item);
    });
  }

  function activateItem(i) {
    // Deactivate previous
    if (activeIndex >= 0) {
      const prev = document.getElementById(`ti-${activeIndex}`);
      if (prev) prev.classList.remove('active');
      if (toiletMarkers[activeIndex]) {
        toiletMarkers[activeIndex].setIcon(makeIcon('#4fffb0', 14));
        toiletMarkers[activeIndex].closePopup();
      }
    }
    // Activate new
    activeIndex = i;
    const item = document.getElementById(`ti-${i}`);
    if (item) {
      item.classList.add('active');
      item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    if (toiletMarkers[i]) {
      toiletMarkers[i].setIcon(makeIcon('#ffd166', 18));
      toiletMarkers[i].openPopup();
      map.panTo(toiletMarkers[i].getLatLng(), { animate: true });
    }
  }
</script>
</body>
</html>
