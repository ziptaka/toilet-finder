<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>トイレ発見器</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f4f8;
  --surface: #ffffff;
  --surface2: #f8fafc;
  --primary: #0066ff;
  --primary-light: #e8f0ff;
  --toilet: #00b894;
  --pachinko: #e17055;
  --convenience: #0984e3;
  --supermarket: #fdcb6e;
  --supermarket-dark: #e6a817;
  --text: #1a1a2e;
  --muted: #888;
  --border: #e2e8f0;
  --shadow: 0 2px 12px rgba(0,0,0,0.1);
  --radius: 14px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; font-family:'Noto Sans JP', sans-serif; background:var(--bg); color:var(--text); }

/* Layout */
.app { display:flex; flex-direction:column; height:100dvh; }
#map { flex:1; min-height:0; }

/* Bottom sheet */
.sheet {
  background:var(--surface);
  border-radius:20px 20px 0 0;
  box-shadow:0 -4px 24px rgba(0,0,0,0.12);
  flex-shrink:0;
  max-height:55dvh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.sheet-handle {
  width:40px; height:4px;
  background:#ddd; border-radius:2px;
  margin:10px auto 0;
}
.sheet-inner { padding:12px 14px 20px; }

/* Filter chips */
.chips {
  display:flex; gap:7px; overflow-x:auto;
  padding-bottom:4px; margin-bottom:12px;
  scrollbar-width:none;
}
.chips::-webkit-scrollbar { display:none; }
.chip {
  display:flex; align-items:center; gap:5px;
  padding:7px 13px; border-radius:20px;
  border:2px solid var(--border);
  background:var(--surface2);
  font-size:13px; font-weight:700;
  white-space:nowrap; cursor:pointer;
  transition:all 0.15s; flex-shrink:0;
  font-family:'Noto Sans JP',sans-serif;
}
.chip.on-toilet   { background:#e8faf4; border-color:var(--toilet);       color:var(--toilet); }
.chip.on-pachinko { background:#fdf0ec; border-color:var(--pachinko);     color:var(--pachinko); }
.chip.on-conv     { background:#e8f4fd; border-color:var(--convenience);  color:var(--convenience); }
.chip.on-super    { background:#fefae8; border-color:var(--supermarket-dark); color:var(--supermarket-dark); }

/* Search button */
.btn-search {
  width:100%; padding:14px;
  background:var(--primary); color:#fff;
  border:none; border-radius:var(--radius);
  font-size:15px; font-weight:700;
  font-family:'Noto Sans JP',sans-serif;
  cursor:pointer; display:flex;
  align-items:center; justify-content:center; gap:8px;
  transition:opacity 0.15s; margin-bottom:10px;
}
.btn-search:disabled { opacity:0.5; }
.btn-search:active { opacity:0.8; }

/* Status */
.status {
  text-align:center; font-size:13px;
  color:var(--muted); min-height:28px;
  display:flex; align-items:center; justify-content:center;
  margin-bottom:6px;
}
.status.ok  { color:var(--toilet); }
.status.err { color:var(--pachinko); }
.status.ing { color:var(--primary); }

/* List */
.list-title { font-size:12px; color:var(--muted); font-weight:700; margin-bottom:8px; letter-spacing:.5px; }
.place-list { display:flex; flex-direction:column; gap:8px; }

.place-card {
  display:flex; align-items:center; gap:11px;
  background:var(--surface2); border-radius:12px;
  padding:11px 12px; cursor:pointer;
  border:2px solid transparent; transition:all 0.12s;
}
.place-card:active { transform:scale(0.98); }
.place-card.active { border-color:var(--primary); background:var(--primary-light); }

.place-icon {
  width:42px; height:42px; border-radius:11px;
  display:flex; align-items:center; justify-content:center;
  font-size:21px; flex-shrink:0;
}
.ic-toilet      { background:#e8faf4; }
.ic-pachinko    { background:#fdf0ec; }
.ic-convenience { background:#e8f4fd; }
.ic-supermarket { background:#fefae8; }

.place-info { flex:1; min-width:0; }
.place-name {
  font-size:13px; font-weight:700;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  margin-bottom:4px;
}
.place-badges { display:flex; gap:5px; flex-wrap:wrap; }
.badge {
  font-size:10px; font-weight:700; padding:2px 7px;
  border-radius:10px;
}
.bd-dist  { background:#e8f0ff; color:var(--primary); }
.bd-cat-toilet      { background:#e8faf4; color:var(--toilet); }
.bd-cat-pachinko    { background:#fdf0ec; color:var(--pachinko); }
.bd-cat-convenience { background:#e8f4fd; color:var(--convenience); }
.bd-cat-supermarket { background:#fefae8; color:var(--supermarket-dark); }
.bd-yes   { background:#e8faf4; color:var(--toilet); }
.bd-no    { background:#fdf0ec; color:var(--pachinko); }
.bd-unk   { background:#f1f5f9; color:#999; }
.bd-fee   { background:#fdf0ec; color:var(--pachinko); }
.bd-wc    { background:#e8f0ff; color:var(--primary); }

/* Route button inside card */
.btn-route {
  flex-shrink:0; padding:8px 11px;
  background:var(--primary); color:#fff;
  border:none; border-radius:9px;
  font-size:12px; font-weight:700;
  font-family:'Noto Sans JP',sans-serif;
  cursor:pointer; white-space:nowrap;
}
.btn-route:active { opacity:0.8; }
.btn-route.cancel { background:#eee; color:#555; }

/* Map overlays */
.map-btn {
  position:absolute; z-index:1000;
  width:44px; height:44px; border-radius:50%;
  background:var(--surface); border:none;
  box-shadow:var(--shadow); font-size:20px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
}
#btnFollow { bottom:16px; right:16px; }
#btnFollow.off { opacity:0.45; }

/* Leaflet */
.leaflet-popup-content-wrapper {
  border-radius:12px; box-shadow:var(--shadow);
  font-family:'Noto Sans JP',sans-serif;
}
.leaflet-popup-content { font-size:13px; line-height:1.6; margin:10px 14px; }
.leaflet-popup-content b { color:var(--primary); }
</style>
</head>
<body>
<div class="app">
  <div id="map">
    <button class="map-btn" id="btnFollow" onclick="recenter()" title="現在地へ">📍</button>
  </div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-inner">
      <!-- Filter chips -->
      <div class="chips">
        <div class="chip on-toilet"   id="c-toilet"      onclick="toggleFilter('toilet')">🚻 公衆トイレ</div>
        <div class="chip on-pachinko" id="c-pachinko"    onclick="toggleFilter('pachinko')">🎰 パチンコ</div>
        <div class="chip on-conv"     id="c-convenience" onclick="toggleFilter('convenience')">🏪 コンビニ</div>
        <div class="chip on-super"    id="c-supermarket" onclick="toggleFilter('supermarket')">🛒 スーパー</div>
      </div>

      <button class="btn-search" id="btnSearch" onclick="startSearch()">
        📍 現在地から探す
      </button>

      <div class="status" id="status">ボタンを押して検索してください</div>
      <div id="listArea"></div>
    </div>
  </div>
</div>

<script>
// ── Map setup ──────────────────────────────────────────
const map = L.map('map', { zoomControl:false, attributionControl:true })
  .setView([35.6812, 139.7671], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© OpenStreetMap contributors', maxZoom:19
}).addTo(map);
L.control.zoom({ position:'topleft' }).addTo(map);

// ── State ──────────────────────────────────────────────
let userLatLng = null;
let userMarker = null;
let watchId    = null;
let isFollowing = false;
let allPlaces  = [];
let allMarkers = [];
let activeIdx  = -1;
let routeLayer = null;
let searching  = false;

const filters = { toilet:true, pachinko:true, convenience:true, supermarket:true };

// ── Config ─────────────────────────────────────────────
const COLORS = {
  toilet:'#00b894', pachinko:'#e17055',
  convenience:'#0984e3', supermarket:'#f9ca24'
};
const ICONS  = { toilet:'🚻', pachinko:'🎰', convenience:'🏪', supermarket:'🛒' };
const LABELS = { toilet:'公衆トイレ', pachinko:'パチンコ', convenience:'コンビニ', supermarket:'スーパー' };
const BDCAT  = { toilet:'bd-cat-toilet', pachinko:'bd-cat-pachinko', convenience:'bd-cat-convenience', supermarket:'bd-cat-supermarket' };

const OVERPASS = 'https://overpass-api.de/api/interpreter';
const OVERPASS2 = 'https://overpass.kumi.systems/api/interpreter';

// ── Helpers ────────────────────────────────────────────
function setStatus(msg, type='') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

function distM(lat1,lng1,lat2,lng2) {
  const R=6371000, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function fmtDist(m) { return m<1000?Math.round(m)+'m':(m/1000).toFixed(1)+'km'; }

function makeMarkerIcon(color, size=14) {
  return L.divIcon({
    className:'',
    html:`<div style="width:${size}px;height:${size}px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize:[size,size], iconAnchor:[size/2,size/2]
  });
}

// ── Filters ────────────────────────────────────────────
function toggleFilter(type) {
  filters[type] = !filters[type];
  const el = document.getElementById('c-'+type);
  const cls = { toilet:'on-toilet', pachinko:'on-pachinko', convenience:'on-conv', supermarket:'on-super' }[type];
  filters[type] ? el.classList.add(cls) : el.classList.remove(cls);
  allMarkers.forEach((m,i) => {
    const p = allPlaces[i];
    if (!p) return;
    filters[p.type] ? (!map.hasLayer(m) && map.addLayer(m)) : (map.hasLayer(m) && map.removeLayer(m));
  });
  renderList();
}

// ── Location ───────────────────────────────────────────
function recenter() {
  isFollowing = true;
  document.getElementById('btnFollow').classList.remove('off');
  if (userLatLng) map.panTo(userLatLng, {animate:true});
}

map.on('dragstart', () => {
  isFollowing = false;
  document.getElementById('btnFollow').classList.add('off');
});

function onPosition(pos) {
  const lat = pos.coords.latitude, lng = pos.coords.longitude;
  userLatLng = [lat, lng];

  if (userMarker) map.removeLayer(userMarker);
  userMarker = L.circleMarker([lat,lng], {
    radius:8, fillColor:'#0066ff', fillOpacity:1,
    color:'#fff', weight:2.5
  }).addTo(map).bindPopup('<b>📍 現在地</b>');

  if (isFollowing) map.panTo([lat,lng], {animate:true});
}

function onPositionError(err) {
  const msgs = {1:'位置情報が拒否されました',2:'位置情報を取得できません',3:'タイムアウト'};
  setStatus('⚠️ '+(msgs[err.code]||'位置情報エラー'), 'err');
}

// ── Overpass fetch ─────────────────────────────────────
async function overpassFetch(query) {
  for (const url of [OVERPASS, OVERPASS2]) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(()=>ctrl.abort(), 18000);
      const res = await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:'data='+encodeURIComponent(query),
        signal:ctrl.signal
      });
      clearTimeout(t);
      if (!res.ok) continue;
      return await res.json();
    } catch(e) { continue; }
  }
  return null;
}

// ── Search ─────────────────────────────────────────────
async function startSearch() {
  if (searching) return;
  searching = true;
  const btn = document.getElementById('btnSearch');
  btn.disabled = true;
  setStatus('📡 現在地を取得中...', 'ing');

  // Clear previous results
  allMarkers.forEach(m => map.removeLayer(m));
  allMarkers = []; allPlaces = [];
  clearRoute(); activeIdx = -1;
  document.getElementById('listArea').innerHTML = '';

  // Get position once for search
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    userLatLng = [lat, lng];

    // Start live tracking
    if (watchId) navigator.geolocation.clearWatch(watchId);
    isFollowing = true;
    document.getElementById('btnFollow').classList.remove('off');
    watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
      enableHighAccuracy:true, maximumAge:3000
    });

    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker([lat,lng], {
      radius:8, fillColor:'#0066ff', fillOpacity:1,
      color:'#fff', weight:2.5
    }).addTo(map).bindPopup('<b>📍 現在地</b>');
    map.setView([lat,lng], 16);

    const r = parseInt(document.getElementById('radiusSlider').value);

    // 4 separate simple queries
    const queryDefs = [
      { type:'toilet',
        q:`[out:json][timeout:20];(node["amenity"="toilets"](around:${r},${lat},${lng});way["amenity"="toilets"](around:${r},${lat},${lng}););out center tags;` },
      { type:'pachinko',
        q:`[out:json][timeout:20];(node["shop"="pachinko"](around:${r},${lat},${lng});node["leisure"="adult_gaming_centre"](around:${r},${lat},${lng});node["amenity"="gambling"]["gambling"="pachinko"](around:${r},${lat},${lng}););out center tags;` },
      { type:'convenience',
        q:`[out:json][timeout:20];(node["shop"="convenience"](around:${r},${lat},${lng}););out center tags;` },
      { type:'supermarket',
        q:`[out:json][timeout:20];(node["shop"="supermarket"](around:${r},${lat},${lng});node["shop"="grocery"](around:${r},${lat},${lng}););out center tags;` },
    ];

    let allElems = [];
    for (let i=0; i<queryDefs.length; i++) {
      const {type, q} = queryDefs[i];
      setStatus(`🔍 検索中... (${i+1}/${queryDefs.length}) ${ICONS[type]}${LABELS[type]}`, 'ing');
      const json = await overpassFetch(q);
      if (json && json.elements) {
        allElems = allElems.concat(json.elements.map(el => ({...el, _type:type})));
      }
    }

    if (allElems.length === 0) {
      setStatus('😢 近くに見つかりませんでした', 'err');
      btn.disabled = false; searching = false; return;
    }

    // Build places
    const places = allElems.map(el => {
      const plat = el.lat ?? el.center?.lat;
      const plng = el.lon ?? el.center?.lon;
      if (!plat || !plng) return null;
      const tags = el.tags || {};
      return { lat:plat, lng:plng, d:distM(lat,lng,plat,plng), tags, type:el._type };
    }).filter(Boolean).sort((a,b)=>a.d-b.d);

    allPlaces = places;

    // Add markers
    places.forEach((p,i) => {
      const m = L.marker([p.lat,p.lng], { icon:makeMarkerIcon(COLORS[p.type], 14) })
        .addTo(map)
        .bindPopup(`<b>${ICONS[p.type]} ${p.tags.name||p.tags['name:ja']||LABELS[p.type]}</b><br>${fmtDist(p.d)}`);
      m.on('click', ()=>selectPlace(i));
      allMarkers.push(m);
    });

    // Filter visibility
    allMarkers.forEach((m,i)=>{ if(allPlaces[i]&&!filters[allPlaces[i].type]) map.removeLayer(m); });

    // Fit map
    const visible = places.filter(p=>filters[p.type]).slice(0,10);
    if (visible.length > 0) {
      map.fitBounds(L.latLngBounds([[lat,lng],...visible.map(p=>[p.lat,p.lng])]), {padding:[40,40],maxZoom:17});
    }

    // Count
    const counts = {toilet:0,pachinko:0,convenience:0,supermarket:0};
    places.forEach(p=>counts[p.type]++);
    const summary = Object.entries(counts).filter(([,v])=>v>0)
      .map(([k,v])=>`${ICONS[k]}${v}`).join(' ');
    setStatus(`✅ ${summary} 見つかりました`, 'ok');

    renderList();
    btn.disabled = false; searching = false;

  }, err => {
    onPositionError(err);
    btn.disabled = false; searching = false;
  }, { enableHighAccuracy:true, timeout:12000 });
}

// ── Render list ────────────────────────────────────────
function renderList() {
  const area = document.getElementById('listArea');
  const visible = allPlaces.filter(p=>filters[p.type]);
  if (visible.length===0) { area.innerHTML=''; return; }

  area.innerHTML = `<div class="list-title">検索結果 ${visible.length}件</div><div class="place-list" id="placeList"></div>`;
  const list = document.getElementById('placeList');

  allPlaces.forEach((p,i) => {
    if (!filters[p.type]) return;
    const tags = p.tags;
    const name = tags.name||tags['name:ja']||LABELS[p.type];
    const isActive = i === activeIdx;

    let toiletBadge = '';
    if (p.type==='convenience'||p.type==='supermarket') {
      if (tags.toilets==='yes') toiletBadge = '<span class="badge bd-yes">🚻あり</span>';
      else if (tags.toilets==='no') toiletBadge = '<span class="badge bd-no">🚻なし</span>';
      else toiletBadge = '<span class="badge bd-unk">🚻不明</span>';
    }

    const isRouting = isActive && routeLayer;
    const routeBtn = isActive
      ? `<button class="btn-route${isRouting?' cancel':''}" onclick="event.stopPropagation();${isRouting?'clearRoute()':'showRoute('+i+')'}">${isRouting?'✕ 消す':'🚶 ルート'}</button>`
      : '';

    const card = document.createElement('div');
    card.className = 'place-card'+(isActive?' active':'');
    card.id = 'pc-'+i;
    card.innerHTML = `
      <div class="place-icon ic-${p.type}">${ICONS[p.type]}</div>
      <div class="place-info">
        <div class="place-name">${name}</div>
        <div class="place-badges">
          <span class="badge bd-dist">📍${fmtDist(p.d)}</span>
          <span class="badge ${BDCAT[p.type]}">${LABELS[p.type]}</span>
          ${toiletBadge}
          ${tags.fee==='yes'?'<span class="badge bd-fee">有料</span>':''}
          ${tags.wheelchair==='yes'?'<span class="badge bd-wc">♿</span>':''}
        </div>
      </div>
      ${routeBtn}
    `;
    card.onclick = () => selectPlace(i);
    list.appendChild(card);
  });
}

// ── Select place ───────────────────────────────────────
function selectPlace(i) {
  // Deselect previous
  if (activeIdx>=0) {
    const prev = document.getElementById('pc-'+activeIdx);
    if (prev) prev.classList.remove('active');
    if (allMarkers[activeIdx]&&allPlaces[activeIdx]) {
      allMarkers[activeIdx].setIcon(makeMarkerIcon(COLORS[allPlaces[activeIdx].type],14));
    }
  }
  if (activeIdx===i) {
    activeIdx=-1; clearRoute(); renderList(); return;
  }
  activeIdx = i;
  const p = allPlaces[i];

  // Highlight marker
  if (allMarkers[i]) {
    allMarkers[i].setIcon(makeMarkerIcon(COLORS[p.type], 20));
    map.panTo([p.lat,p.lng], {animate:true});
  }
  renderList();
  const card = document.getElementById('pc-'+i);
  if (card) card.scrollIntoView({behavior:'smooth',block:'nearest'});
}

// ── Route (OSRM) ───────────────────────────────────────
function clearRoute() {
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer=null; }
}

async function showRoute(i) {
  const p = allPlaces[i];
  if (!p||!userLatLng) return;
  clearRoute();
  setStatus('🔍 ルート検索中...','ing');
  const [ulat,ulng] = userLatLng;
  try {
    const res = await fetch(
      `https://router.project-osrm.org/route/v1/foot/${ulng},${ulat};${p.lng},${p.lat}?overview=full&geometries=geojson`
    );
    const json = await res.json();
    if (!json.routes||!json.routes[0]) throw new Error('no route');
    const coords = json.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
    const mins = Math.ceil(json.routes[0].duration/60);
    const dist = Math.round(json.routes[0].distance);
    routeLayer = L.polyline(coords,{color:COLORS[p.type],weight:5,opacity:0.8,dashArray:'10,6'}).addTo(map);
    map.fitBounds(routeLayer.getBounds(),{padding:[50,50]});
    setStatus(`🚶 徒歩約${mins}分 / ${fmtDist(dist)}`,'ok');
  } catch(e) {
    setStatus('❌ ルート取得に失敗しました','err');
  }
  renderList();
}

// ── Radius slider ──────────────────────────────────────
</script>

<!-- Radius slider (outside sheet-inner so it's always visible) -->
<style>
.radius-bar {
  display:flex; align-items:center; gap:10px;
  padding:0 14px 8px; font-size:12px; color:var(--muted);
}
input[type=range] { flex:1; accent-color:var(--primary); }
.radius-val { font-weight:700; color:var(--primary); min-width:42px; text-align:right; }
</style>
<script>
// Insert radius bar into sheet-inner before btn-search
document.addEventListener('DOMContentLoaded', () => {
  const bar = document.createElement('div');
  bar.className = 'radius-bar';
  bar.innerHTML = `<span>検索範囲</span><input type="range" id="radiusSlider" min="200" max="2000" step="100" value="500"><span class="radius-val" id="radiusVal">500m</span>`;
  const btn = document.getElementById('btnSearch');
  btn.parentNode.insertBefore(bar, btn);
  document.getElementById('radiusSlider').oninput = e => {
    document.getElementById('radiusVal').textContent = e.target.value+'m';
  };
});
</script>
</body>
</html>
