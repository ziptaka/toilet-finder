<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トイレ発見器</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Space+Grotesk:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d2e;
    --surface2: #252840;
    --accent: #4fffb0;
    --accent2: #ff6b6b;
    --accent3: #ffd166;
    --text: #e8eaf6;
    --muted: #6b7280;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid #ffffff0f;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 1000;
    flex-shrink: 0;
  }
  .logo {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 900;
    font-size: 20px;
    background: linear-gradient(135deg, var(--accent), #00d4ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .logo-icon { font-size: 24px; animation: bounce 2s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #map { flex: 1; min-height: 0; z-index: 1; }

  .panel {
    background: var(--surface);
    border-top: 1px solid #ffffff10;
    padding: 12px 14px;
    flex-shrink: 0;
    max-height: 50%;
    overflow-y: auto;
  }

  /* Filter toggles */
  .filter-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 5px 10px;
    border-radius: 20px;
    border: 1.5px solid #ffffff20;
    background: var(--surface2);
    color: var(--muted);
    font-size: 12px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: #4fffb015;
  }
  .filter-btn.active.pachinko { border-color: #ff6b6b; color: #ff6b6b; background: #ff6b6b15; }
  .filter-btn.active.convenience { border-color: #00d4ff; color: #00d4ff; background: #00d4ff15; }
  .filter-btn.active.supermarket { border-color: #ffd166; color: #ffd166; background: #ffd16615; }

  .radius-control {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  .radius-control label { white-space: nowrap; }
  input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; }
  .radius-val { font-weight: 700; color: var(--accent); min-width: 50px; text-align: right; }

  .btn-search {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--accent), #00d4ff);
    color: #0f1117;
    border: none;
    border-radius: var(--radius);
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-search:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-search:active { transform: translateY(0); }
  .btn-search:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .status {
    text-align: center;
    padding: 8px;
    font-size: 13px;
    color: var(--muted);
    min-height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .status.loading { color: var(--accent); }
  .status.error { color: var(--accent2); }
  .status.success { color: var(--accent); }

  .section-title {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 12px;
    color: var(--muted);
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .place-list { display: flex; flex-direction: column; gap: 7px; }

  .place-item {
    background: var(--surface2);
    border-radius: 12px;
    padding: 10px 12px;
    cursor: pointer;
    transition: all 0.15s;
    border: 1px solid transparent;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .place-item:hover { border-color: var(--accent); transform: translateX(3px); }
  .place-item.active { border-color: var(--accent); background: #4fffb01a; }

  .place-icon-wrap {
    width: 38px; height: 38px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
  }
  .type-toilet  .place-icon-wrap { background: #4fffb020; }
  .type-pachinko .place-icon-wrap { background: #ff6b6b20; }
  .type-convenience .place-icon-wrap { background: #00d4ff20; }
  .type-supermarket .place-icon-wrap { background: #ffd16620; }

  .place-info { flex: 1; min-width: 0; }
  .place-name {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
  }
  .place-meta { font-size: 11px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }

  .badge { padding: 2px 7px; border-radius: 20px; font-size: 10px; font-weight: 700; }
  .badge-dist { background: #4fffb020; color: var(--accent); }
  .badge-toilet { background: #4fffb020; color: var(--accent); }
  .badge-pachinko { background: #ff6b6b20; color: #ff6b6b; }
  .badge-convenience { background: #00d4ff20; color: #00d4ff; }
  .badge-supermarket { background: #ffd16620; color: #ffd166; }
  .badge-fee { background: #ff6b6b20; color: var(--accent2); }
  .badge-accessible { background: #00d4ff20; color: #00d4ff; }

  /* Legend */
  .legend {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 8px;
    font-size: 11px;
    color: var(--muted);
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  .leaflet-container { background: #1a1d2e; }
  .leaflet-tile { filter: brightness(0.85) saturate(0.9); }
  .leaflet-popup-content-wrapper {
    background: var(--surface2); color: var(--text);
    border: 1px solid #ffffff15; border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .leaflet-popup-tip { background: var(--surface2); }
  .leaflet-popup-content { margin: 10px 12px; font-size: 12px; line-height: 1.6; }
  .leaflet-popup-content b { color: var(--accent); font-family: 'Zen Maru Gothic', sans-serif; }
</style>
</head>
<body>

<header>
  <span class="logo-icon">🚻</span>
  <span class="logo">トイレ発見器</span>
</header>

<div class="main">
  <div id="map"></div>
  <!-- 現在地追従ボタン -->
  <button id="btnFollow" onclick="recenter()" style="
    position:absolute; bottom:180px; right:12px; z-index:1000;
    width:42px; height:42px; border-radius:50%;
    background:var(--surface); border:1px solid #ffffff20;
    font-size:20px; cursor:pointer; opacity:0.4;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.4); transition:opacity 0.2s;
  ">📍</button>

  <div class="panel">
    <!-- Filter buttons -->
    <div class="filter-row">
      <button class="filter-btn active" id="f-toilet" onclick="toggleFilter('toilet')">🚻 公衆トイレ</button>
      <button class="filter-btn active pachinko" id="f-pachinko" onclick="toggleFilter('pachinko')">🎰 パチンコ</button>
      <button class="filter-btn active convenience" id="f-convenience" onclick="toggleFilter('convenience')">🏪 コンビニ</button>
      <button class="filter-btn active supermarket" id="f-supermarket" onclick="toggleFilter('supermarket')">🛒 スーパー</button>
    </div>

    <div class="radius-control">
      <label>検索範囲</label>
      <input type="range" id="radius" min="200" max="2000" step="100" value="500">
      <span class="radius-val" id="radiusVal">500m</span>
    </div>

    <button class="btn-search" id="btnSearch" onclick="searchAll()">
      <span>📍</span> 現在地から探す
    </button>

    <div class="status" id="status"></div>
    <div id="listArea"></div>
  </div>
</div>

<script>
  const map = L.map('map', { zoomControl: true }).setView([35.6812, 139.7671], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 19
  }).addTo(map);

  let userMarker = null;
  let allMarkers = [];
  let userLatLng = null;
  let activeIndex = -1;
  let allPlaces = [];
  let watchId = null;
  let isFollowing = true;

  // Filter state
  const filters = { toilet: true, pachinko: true, convenience: true, supermarket: true };

  // Marker colors per type
  const TYPE_COLORS = {
    toilet: '#4fffb0',
    pachinko: '#ff6b6b',
    convenience: '#00d4ff',
    supermarket: '#ffd166'
  };

  const TYPE_LABELS = {
    toilet: '🚻 公衆トイレ',
    pachinko: '🎰 パチンコ',
    convenience: '🏪 コンビニ',
    supermarket: '🛒 スーパー'
  };

  const TYPE_BADGE = {
    toilet: 'badge-toilet',
    pachinko: 'badge-pachinko',
    convenience: 'badge-convenience',
    supermarket: 'badge-supermarket'
  };

  function toggleFilter(type) {
    filters[type] = !filters[type];
    const btn = document.getElementById('f-' + type);
    if (filters[type]) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
    renderList(allPlaces);
    updateMarkerVisibility();
  }

  function updateMarkerVisibility() {
    allMarkers.forEach((m, i) => {
      const p = allPlaces[i];
      if (!p) return;
      if (filters[p.type]) {
        if (!map.hasLayer(m)) map.addLayer(m);
      } else {
        if (map.hasLayer(m)) map.removeLayer(m);
      }
    });
  }

  const radiusSlider = document.getElementById('radius');
  const radiusVal = document.getElementById('radiusVal');
  radiusSlider.oninput = () => { radiusVal.textContent = radiusSlider.value + 'm'; };

  function setStatus(msg, type='') {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + type;
  }

  function makeIcon(color, size=14) {
    return L.divIcon({
      className: '',
      html: `<div style="width:${size}px;height:${size}px;background:${color};border:2.5px solid #0f1117;border-radius:50%;box-shadow:0 0 0 2px ${color},0 3px 10px ${color}55;"></div>`,
      iconSize: [size, size],
      iconAnchor: [size/2, size/2]
    });
  }

  function distStr(m) {
    return m < 1000 ? Math.round(m) + 'm' : (m/1000).toFixed(1) + 'km';
  }

  function dist(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const dLat = (lat2-lat1)*Math.PI/180;
    const dLng = (lng2-lng1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  async function searchAll() {
    const btn = document.getElementById('btnSearch');
    btn.disabled = true;
    setStatus('📡 現在地を取得中...', 'loading');

    allMarkers.forEach(m => map.removeLayer(m));
    allMarkers = [];
    allPlaces = [];
    document.getElementById('listArea').innerHTML = '';
    activeIndex = -1;

    // Stop previous watch
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    isFollowing = true;

    const doSearch = async (pos) => {
      userLatLng = [pos.coords.latitude, pos.coords.longitude];
      const [lat, lng] = userLatLng;

      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.marker(userLatLng, { icon: makeIcon('#ffffff', 16) })
        .addTo(map)
        .bindPopup('<b>📍 現在地</b>');
      if (isFollowing) map.panTo(userLatLng, { animate: true });

      // Only search on first fix
      if (allPlaces.length > 0) return;

      const radius = parseInt(radiusSlider.value);
      setStatus('🔍 検索中...', 'loading');

      // Overpass query - toilets (public), pachinko, convenience+toilet, supermarket+toilet
      const query = `
        [out:json][timeout:20];
        (
          node["amenity"="toilets"](around:${radius},${lat},${lng});
          way["amenity"="toilets"](around:${radius},${lat},${lng});
          node["leisure"="adult_gaming_centre"](around:${radius},${lat},${lng});
          node["amenity"="casino"]["gambling"="pachinko"](around:${radius},${lat},${lng});
          node["shop"="pachinko"](around:${radius},${lat},${lng});
          node["amenity"="convenience"](around:${radius},${lat},${lng});
          node["shop"="convenience"](around:${radius},${lat},${lng});
          node["shop"="supermarket"](around:${radius},${lat},${lng});
          node["shop"="grocery"](around:${radius},${lat},${lng});
        );
        out center tags;
      `;

      const servers = [
        'https://overpass-api.de/api/interpreter',
        'https://overpass.kumi.systems/api/interpreter',
      ];

      let json = null;
      for (const server of servers) {
        try {
          setStatus(`🔍 検索中... (${server.includes('kumi') ? 'サーバー2' : 'サーバー1'})`, 'loading');
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 25000);
          const res = await fetch(server, {
            method: 'POST',
            body: 'data=' + encodeURIComponent(query),
            signal: controller.signal
          });
          clearTimeout(timer);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          json = await res.json();
          break;
        } catch(e) {
          setStatus(`⚠️ サーバー切替中...`, 'loading');
          continue;
        }
      }

      try {
        if (!json) throw new Error('全サーバー失敗');
        const elements = json.elements || [];

        if (elements.length === 0) {
          setStatus(`😢 半径${radius}m以内に何も見つかりませんでした`, 'error');
          btn.disabled = false;
          return;
        }

        // Classify each element
        const places = elements.map(el => {
          const plat = el.lat ?? el.center?.lat;
          const plng = el.lon ?? el.center?.lon;
          const d = dist(lat, lng, plat, plng);
          const tags = el.tags || {};
          let type = 'toilet';
          if (tags.amenity === 'toilets') type = 'toilet';
          else if (tags.leisure === 'adult_gaming_centre' || tags.shop === 'pachinko' || tags['gambling'] === 'pachinko') type = 'pachinko';
          else if (tags.amenity === 'convenience' || tags.shop === 'convenience') type = 'convenience';
          else if (tags.shop === 'supermarket' || tags.shop === 'grocery') type = 'supermarket';
          return { lat: plat, lng: plng, d, tags, type };
        }).sort((a, b) => a.d - b.d);

        allPlaces = places;

        // Count by type
        const counts = { toilet: 0, pachinko: 0, convenience: 0, supermarket: 0 };
        places.forEach(p => counts[p.type]++);
        const summary = Object.entries(counts)
          .filter(([,v]) => v > 0)
          .map(([k, v]) => `${TYPE_LABELS[k].split(' ')[0]}${v}件`)
          .join(' ');
        setStatus(`✅ ${summary} 見つかりました！`, 'success');

        // Create markers
        places.forEach((p, i) => {
          const color = TYPE_COLORS[p.type];
          const marker = L.marker([p.lat, p.lng], { icon: makeIcon(color, 14) })
            .addTo(map)
            .bindPopup(popupHtml(p));
          marker.on('click', () => activateItem(i));
          allMarkers.push(marker);
        });

        updateMarkerVisibility();
        renderList(places);

        const bounds = L.latLngBounds([userLatLng, ...places.slice(0, 15).map(p => [p.lat, p.lng])]);
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 17 });

      } catch(e) {
        setStatus(`❌ 検索失敗: ${e.message || 'ネットワークエラー'} しばらく待って再試行してください`, 'error');
      }

      btn.disabled = false;
    };

    watchId = navigator.geolocation.watchPosition(
      doSearch,
      err => {
        const msgs = { 1:'位置情報へのアクセスが拒否されました', 2:'位置情報を取得できませんでした', 3:'タイムアウトしました' };
        setStatus('⚠️ ' + (msgs[err.code] || '不明なエラー'), 'error');
        btn.disabled = false;
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 3000 }
    );

    // 地図ドラッグで追従オフ
    map.on('dragstart', () => {
      isFollowing = false;
      document.getElementById('btnFollow').style.opacity = '1';
    });
  }

  function recenter() {
    isFollowing = true;
    document.getElementById('btnFollow').style.opacity = '0.4';
    if (userLatLng) map.panTo(userLatLng, { animate: true });
  }

  function popupHtml(p) {
    const tags = p.tags;
    const name = tags.name || tags['name:ja'] || TYPE_LABELS[p.type];
    const fee = tags.fee === 'yes' ? '💴 有料' : tags.fee === 'no' ? '🆓 無料' : '';
    const accessible = tags.wheelchair === 'yes' ? '♿ 車椅子対応' : '';
    const open = tags.opening_hours ? `🕐 ${tags.opening_hours}` : '';
    const emoji = { toilet:'🚻', pachinko:'🎰', convenience:'🏪', supermarket:'🛒' }[p.type];
    const details = [fee, accessible, open].filter(Boolean).join('<br>');
    return `<b>${emoji} ${name}</b><br>${details || '詳細情報なし'}`;
  }

  function renderList(places) {
    const area = document.getElementById('listArea');
    const visible = places.filter(p => filters[p.type]);
    if (visible.length === 0 && places.length > 0) {
      area.innerHTML = `<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px;">フィルターをオンにして表示</div>`;
      return;
    }
    area.innerHTML = `<div class="section-title" style="margin-top:8px;">検索結果 ${visible.length}件</div><div class="place-list" id="placeList"></div>`;
    const list = document.getElementById('placeList');

    places.forEach((p, i) => {
      if (!filters[p.type]) return;
      const tags = p.tags;
      const name = tags.name || tags['name:ja'] || TYPE_LABELS[p.type];
      const fee = tags.fee === 'yes';
      const accessible = tags.wheelchair === 'yes';
      const emoji = { toilet:'🚻', pachinko:'🎰', convenience:'🏪', supermarket:'🛒' }[p.type];

      const item = document.createElement('div');
      item.className = `place-item type-${p.type}`;
      item.id = `pi-${i}`;
      item.innerHTML = `
        <div class="place-icon-wrap">${emoji}</div>
        <div class="place-info">
          <div class="place-name">${name}</div>
          <div class="place-meta">
            <span class="badge badge-dist">📍 ${distStr(p.d)}</span>
            <span class="badge ${TYPE_BADGE[p.type]}">${TYPE_LABELS[p.type].split(' ')[1]}</span>
            ${p.type === 'convenience' || p.type === 'supermarket'
              ? tags.toilets === 'yes'
                ? '<span class="badge badge-toilet">🚻 トイレあり</span>'
                : tags.toilets === 'no'
                  ? '<span class="badge" style="background:#ff6b6b20;color:#ff6b6b">🚻 トイレなし</span>'
                  : '<span class="badge" style="background:#6b728030;color:#9ca3af">🚻 トイレ不明</span>'
              : ''}
            ${fee ? '<span class="badge badge-fee">有料</span>' : ''}
            ${accessible ? '<span class="badge badge-accessible">♿</span>' : ''}
          </div>
        </div>
      `;
      item.onclick = () => activateItem(i);
      list.appendChild(item);
    });
  }

  function activateItem(i) {
    if (activeIndex >= 0) {
      const prev = document.getElementById(`pi-${activeIndex}`);
      if (prev) prev.classList.remove('active');
      if (allMarkers[activeIndex] && allPlaces[activeIndex]) {
        allMarkers[activeIndex].setIcon(makeIcon(TYPE_COLORS[allPlaces[activeIndex].type], 14));
        allMarkers[activeIndex].closePopup();
      }
    }
    activeIndex = i;
    const item = document.getElementById(`pi-${i}`);
    if (item) { item.classList.add('active'); item.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    if (allMarkers[i]) {
      allMarkers[i].setIcon(makeIcon('#ffffff', 18));
      allMarkers[i].openPopup();
      map.panTo(allMarkers[i].getLatLng(), { animate: true });
    }
  }
</script>
</body>
</html>
